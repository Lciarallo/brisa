<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Brisa logo — SPDX-License-Identifier: GPL-3.0-or-later -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="0.55" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#26a1a8"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f0fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2a55" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <circle cx="200" cy="58" r="70" fill="#ffffff" opacity="0.07"/>
  <!-- indoor unit -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="176" height="60" rx="24" fill="url(#unit)"/>
  </g>
  <rect x="62" y="81" width="132" height="6" rx="3" fill="#1c71d8" opacity="0.35"/>
  <circle cx="64" cy="60" r="5" fill="#33d17a"/>
  <rect x="160" y="54" width="34" height="12" rx="6" fill="#1c71d8" opacity="0.18"/>
  <!-- breeze -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="11">
    <path d="M50 150 H156 a16 16 0 1 0 -16 -16"/>
    <path d="M50 180 H184 a18 18 0 1 1 -18 18" opacity="0.9"/>
    <path d="M72 210 H128" opacity="0.7"/>
  </g>
</svg>
